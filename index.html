<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TD Tracker</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #075985;
      color: white;
      padding: 25px;
      text-align: center;
    }

    .box {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 12px;
    }

    .td {
      padding: 15px 0;
      border-bottom: 1px solid #ddd;
    }

    .name {
      font-size: 20px;
      font-weight: bold;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>TD Tracker</h1>
  <p>How did your TD vote?</p>
</header>

<div class="box">
  <h2>Your TDs</h2>
  <div id="status">Loading TD data...</div>
  <div id="tds"></div>
</div>

<script>

async function loadTDs() {

  const status = document.getElementById("status");
  const tds = document.getElementById("tds");

  try {

    const response = await fetch("/api/members");

    if (!response.ok) {
      throw new Error("API returned HTTP " + response.status);
    }

    const data = await response.json();

    console.log(data);

    const results = data.results || [];

    if (results.length === 0) {
      status.innerHTML = "API connected, but no TDs were returned.";
      return;
    }

    status.innerHTML =
      "API connected successfully. " + results.length + " TD records found.";

    tds.innerHTML = results.slice(0, 20).map(item => {

      const member = item.member || item;

      const name =
        member.fullName ||
        ((member.firstName || "") + " " + (member.lastName || "")).trim() ||
        "Unknown TD";

      return `
        <div class="td">
          <div class="name">${escapeHtml(name)}</div>
          <div>TD • Dáil Éireann</div>
        </div>
      `;

    }).join("");

  } catch (error) {

    console.error(error);

    status.innerHTML =
      '<div class="error">ERROR: ' +
      escapeHtml(error.message) +
      '</div>';

  }

}

function escapeHtml(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

loadTDs();

</script>

</body>
</html>
