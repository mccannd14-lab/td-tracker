<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TD Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #075985;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 17px;
    }

    .box {
      background: white;
      margin: 20px auto;
      padding: 22px;
      border-radius: 14px;
      max-width: 850px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #075985;
    }

    select {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: white;
    }

    .td {
      padding: 17px 0;
      border-bottom: 1px solid #ddd;
    }

    .td:last-child {
      border-bottom: none;
    }

    .name {
      font-size: 20px;
      font-weight: bold;
    }

    .info {
      margin-top: 5px;
      color: #666;
    }

    .status {
      color: #555;
      margin-bottom: 15px;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }

    .vote-placeholder {
      color: #666;
      line-height: 1.5;
    }

    .source {
      font-size: 13px;
      color: #666;
      margin-top: 20px;
    }

    a {
      color: #075985;
    }
  </style>
</head>

<body>

<header>
  <h1>TD Tracker</h1>
  <p>How did your TD vote?</p>
</header>


<!-- CONSTITUENCY -->

<div class="box">

  <h2>Your constituency</h2>

  <select id="constituency">
    <option value="">Select your constituency</option>
  </select>

</div>


<!-- TDs -->

<div class="box">

  <h2>Your TDs</h2>

  <div id="status">
    Loading TD data...
  </div>

  <div id="tds"></div>

</div>


<!-- VOTES -->

<div class="box">

  <h2>Recent Dáil votes</h2>

  <div class="vote-placeholder">
    <p>
      The live Dáil voting records will appear here next.
    </p>

    <p>
      Each vote will be linked to the official
      Houses of the Oireachtas record.
    </p>
  </div>

  <div class="source">
    Data supplied from the
    <a
      href="https://www.oireachtas.ie/en/open-data/"
      target="_blank">
      Houses of the Oireachtas
    </a>.
  </div>

</div>
