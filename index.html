⁸<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TD Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #075985;
      color: white;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 17px;
    }

    .box {
      background: white;
      margin: 20px auto;
      padding: 22px;
      border-radius: 14px;
      max-width: 850px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #075985;
    }

    select {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: white;
    }

    .td {
      padding: 16px 0;
      border-bottom: 1px solid #ddd;
    }

    .td:last-child {
      border-bottom: none;
    }

    .name {
      font-size: 20px;
      font-weight: bold;
    }

    .info {
      margin-top: 4px;
      color: #666;
    }

    .status {
      color: #555;
      margin-bottom: 15px;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }

    .source {
      font-size: 13px;
      color: #666;
      margin-top: 20px;
    }

    a {
      color: #075985;
    }
  </style>
</head>

<body>

<header>
  <h1>TD Tracker</h1>
  <p>How did your TD vote?</p>
</header>


<!-- CONSTITUENCY -->

<div class="box">

  <h2>Your constituency</h2>

  <select id="constituency">
    <option value="">Loading constituencies...</option>
  </select>

</div>


<!-- TDs -->

<div class="box">

  <h2>Your TDs</h2>

  <div id="status">
    Loading TD data...
  </div>

  <div id="tds"></div>

</div>


<div class="box">

  <h2>Recent Dáil votes</h2>

  <p>
    Vote information will be connected next.
  </p>

  <div class="source">
    Data supplied from the
    <a
      href="https://www.oireachtas.ie/en/open-data/"
      target="_blank">
      Houses of the Oireachtas
    </a>.
  </div>

</div>


<script>

async function loadTDs() {

  const status = document.getElementById("status");
  const tds = document.getElementById("tds");
  const constituency =
    document.getElementById("constituency");

  try {

    const response =
      await fetch("/api/members");

    if (!response.ok) {
      throw new Error(
        "API returned HTTP " + response.status
      );
    }

    const data =
      await response.json();

    const results =
      data.results || [];

    if (results.length === 0) {

      status.innerHTML =
        "No TDs were returned.";

      return;
    }


    /* --------------------------------
       FIND CONSTITUENCIES
    -------------------------------- */

    const constituencies =
      new Set();


    results.forEach(item => {

      const member =
        item.member || item;

      const memberships =
        member.memberships || [];


      memberships.forEach(item => {

        /*
          Oireachtas data normally places
          constituency information under
          membership.organization.
        */

        const represents =
  item.represents || [];

represents.forEach(rep => {

  const constituency =
    rep.represent || {};

  if (constituency.showAs) {

    constituencies.add(
      constituency.showAs
    );

  }

});

      });

    });


    /* --------------------------------
       BUILD DROPDOWN
    -------------------------------- */

    constituency.innerHTML = "";

    const allOption =
      document.createElement("option");

    allOption.value = "";

    allOption.textContent =
      "All constituencies";

    constituency.appendChild(
      allOption
    );


    Array.from(constituencies)
      .sort()
      .forEach(name => {

        const option =
          document.createElement("option");

        option.value = name;

        option.textContent = name;

        constituency.appendChild(
          option
        );

      });


    /* --------------------------------
       AUTOMATICALLY SELECT TIPPERARY
    -------------------------------- */

    const tipperary =
      Array.from(constituencies)
        .find(name =>
          name.toLowerCase()
            .includes("tipperary")
        );


    if (tipperary) {

      constituency.value =
        tipperary;

    }


    /* --------------------------------
       SHOW TDs
    -------------------------------- */

    displayTDs(results);


    /* --------------------------------
       DROPDOWN CHANGE
    -------------------------------- */

    constituency.onchange = function() {

      displayTDs(results);

    };


  } catch (error) {

    console.error(error);

    status.innerHTML =
      '<div class="error">' +
      'ERROR: ' +
      escapeHtml(error.message) +
      '</div>';

  }

}


/* --------------------------------
   DISPLAY TDs
-------------------------------- */

function displayTDs(results) {

  const tds =
    document.getElementById("tds");

  const constituency =
    document.getElementById("constituency");

  const selected =
    constituency.value;


  let filtered =
    results;


  if (selected) {

    filtered =
      results.filter(item => {

        const member =
          item.member || item;

        const memberships =
          member.memberships || [];


        return memberships.some(item => {

          const organization =
            item.organization || {};


          return (
            organization.showAs === selected ||
            organization.name === selected
          );

        });

      });

  }


  if (filtered.length === 0) {

    tds.innerHTML =
      "<p>No TDs found for this constituency.</p>";

    return;
  }


  tds.innerHTML =
    filtered.map(item => {

      const member =
        item.member || item;


      const name =
        member.fullName ||
        (
          (member.firstName || "") +
          " " +
          (member.lastName || "")
        ).trim();


      return `
        <div class="td">

          <div class="name">
            ${escapeHtml(name || "Unknown TD")}
          </div>

          <div class="info">
            TD • Dáil Éireann
          </div>

        </div>
      `;

    }).join("");

}


/* --------------------------------
   SAFELY DISPLAY TEXT
-------------------------------- */

function escapeHtml(text) {

  return String(text)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* --------------------------------
   START
-------------------------------- */

loadTDs();

</script>

</body>
</html>
