<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TD Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #075985;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 34px;
    }

    header p {
      margin: 8px 0 0;
      font-size: 17px;
    }

    .box {
      background: white;
      margin: 20px auto;
      padding: 22px;
      border-radius: 14px;
      max-width: 850px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      color: #075985;
    }

    select {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: 1px solid #bbb;
      border-radius: 8px;
      background: white;
      margin-bottom: 10px;
    }

    .td {
      padding: 17px 0;
      border-bottom: 1px solid #ddd;
    }

    .td:last-child {
      border-bottom: none;
    }

    .name {
      font-size: 20px;
      font-weight: bold;
    }

    .info {
      margin-top: 5px;
      color: #666;
    }

    .status {
      color: #555;
      margin-bottom: 15px;
    }

    .error {
      color: #b00020;
      font-weight: bold;
    }

    .vote {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 18px;
      margin: 15px 0;
      background: #fafafa;
    }

    .vote-date {
      color: #666;
      font-size: 14px;
      margin-bottom: 7px;
    }

    .vote-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 15px;
      line-height: 1.35;
    }

    .td-vote {
      padding: 12px;
      margin: 8px 0;
      background: white;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .td-vote-name {
      font-weight: bold;
      font-size: 16px;
    }

    .vote-result {
      margin-top: 5px;
      font-weight: bold;
    }

    .official {
      display: inline-block;
      margin-top: 12px;
      padding: 9px 12px;
      background: #075985;
      color: white;
      text-decoration: none;
      border-radius: 7px;
      font-size: 14px;
    }

    .official:hover {
      opacity: 0.9;
    }

    .source {
      font-size: 13px;
      color: #666;
      margin-top: 20px;
    }

    a {
      color: #075985;
    }

    .loading {
      color: #666;
      padding: 10px 0;
    }

    .notice {
      background: #eef6fb;
      border-left: 4px solid #075985;
      padding: 12px;
      margin-bottom: 15px;
      color: #444;
    }
  </style>
</head>

<body>

<header>
  <h1>TD Tracker</h1>
  <p>How did your TD vote?</p>
</header>


<!-- ==============================
     CONSTITUENCY
============================== -->

<div class="box">

  <h2>Your constituency</h2>

  <select id="constituency">
    <option value="">Select your constituency</option>
  </select>

</div>


<!-- ==============================
     TDs
============================== -->

<div class="box">

  <h2>Your TDs</h2>

  <div id="status">
    Loading TD data...
  </div>

  <div id="tds"></div>

</div>


<!-- ==============================
     VOTES
============================== -->

<div class="box">

  <h2>Recent Dáil votes</h2>

  <div id="voteStatus" class="loading">
    Loading recent votes...
  </div>

  <div id="votes"></div>

  <div class="source">
    Voting data supplied from the
    <a
      href="https://www.oireachtas.ie/en/open-data/"
      target="_blank">
      Houses of the Oireachtas
    </a>.
  </div>

</div>


<script>

let allMembers = [];
let allVotes = [];


/* ==============================
   GET CONSTITUENCIES FOR A TD
============================== */

function getMemberConstituencies(member) {

  const found = [];

  const memberships =
    Array.isArray(member.memberships)
      ? member.memberships
      : [];


  memberships.forEach(wrapper => {

    const membership =
      wrapper && wrapper.membership
        ? wrapper.membership
        : wrapper;


    if (!membership) {
      return;
    }


    let represents =
      membership.represents || [];


    if (!Array.isArray(represents)) {
      represents = [represents];
    }


    represents.forEach(rep => {

      if (!rep) {
        return;
      }


      const constituency =
        rep.represent || {};


      const name =
        constituency.showAs ||
        constituency.name ||
        "";


      if (
        name &&
        !found.includes(name)
      ) {
        found.push(name);
      }

    });

  });


  return found;
}


/* ==============================
   LOAD TDs
============================== */

async function loadTDs() {

  const status =
    document.getElementById("status");

  const select =
    document.getElementById("constituency");


  try {

    const response =
      await fetch("/api/members");


    if (!response.ok) {

      throw new Error(
        "TD API returned HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    allMembers =
      Array.isArray(data.results)
        ? data.results
        : [];


    if (!allMembers.length) {

      throw new Error(
        "No TD records were returned"
      );

    }


    /* FIND CONSTITUENCIES */

    const constituencySet =
      new Set();


    allMembers.forEach(result => {

      const member =
        result.member || {};


      const names =
        getMemberConstituencies(member);


      names.forEach(name => {

        constituencySet.add(name);

      });

    });


    /* BUILD DROPDOWN */

    select.innerHTML = "";


    const first =
      document.createElement("option");


    first.value = "";

    first.textContent =
      "Select your constituency";


    select.appendChild(first);


    Array.from(constituencySet)
      .sort()
      .forEach(name => {

        const option =
          document.createElement("option");


        option.value = name;

        option.textContent = name;


        select.appendChild(option);

      });


    status.textContent =
      allMembers.length +
      " TD records found.";


    displayTDs();


    select.onchange =
      function() {

        displayTDs();
        displayVotes();

      };


  } catch (error) {

    console.error(error);


    status.innerHTML =
      '<div class="error">' +
      'ERROR: ' +
      escapeHtml(error.message) +
      '</div>';

  }

}


/* ==============================
   DISPLAY TDs
============================== */

function displayTDs() {

  const list =
    document.getElementById("tds");


  const select =
    document.getElementById("constituency");


  const selected =
    select.value;


  let filtered =
    allMembers;


  if (selected) {

    filtered =
      allMembers.filter(result => {

        const member =
          result.member || {};


        const constituencies =
          getMemberConstituencies(member);


        return constituencies.includes(
          selected
        );

      });

  }


  if (!filtered.length) {

    list.innerHTML =
      "<p>No TDs found for this constituency.</p>";

    return;

  }


  list.innerHTML =
    filtered.map(result => {

      const member =
        result.member || {};


      const name =
        member.fullName ||
        (
          (member.firstName || "") +
          " " +
          (member.lastName || "")
        ).trim();


      return `
        <div class="td">

          <div class="name">
            ${escapeHtml(
              name || "Unknown TD"
            )}
          </div>

          <div class="info">
            TD • Dáil Éireann
          </div>

        </div>
      `;

    }).join("");

}


/* ==============================
   LOAD VOTES
============================== */

async function loadVotes() {

  const status =
    document.getElementById("voteStatus");


  try {

    const response =
      await fetch("/api/votes");


    if (!response.ok) {

      throw new Error(
        "Vote API returned HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    allVotes =
      Array.isArray(data.results)
        ? data.results
        : [];


    if (!allVotes.length) {

      throw new Error(
        "No vote records were returned"
      );

    }


    status.textContent =
      allVotes.length +
      " recent Dáil votes loaded.";


    displayVotes();


  } catch (error) {

    console.error(error);


    status.innerHTML =
      '<div class="error">' +
      'ERROR: ' +
      escapeHtml(error.message) +
      '</div>';

  }

}


/* ==============================
   GET VOTE FROM A TD
============================== */

function getTDVote(division, member) {

  const memberCode =
    member.memberCode;


  const tallies =
    Array.isArray(division.tallies)
      ? division.tallies
      : [];


  for (const tallyWrapper of tallies) {

    const tally =
      tallyWrapper &&
      tallyWrapper.tally
        ? tallyWrapper.tally
        : tallyWrapper;


    if (!tally) {
      continue;
    }


    const members =
      Array.isArray(tally.members)
        ? tally.members
        : [];


    const found =
      members.find(voteMember => {

        const m =
          voteMember.member ||
          voteMember;


        return (
          m.memberCode === memberCode
        );

      });


    if (found) {

      return (
        tally.showAs ||
        tally.name ||
        "Recorded"
      );

    }

  }


  return "Not recorded";

}


/* ==============================
   DISPLAY VOTES
============================== */

function displayVotes() {

  const container =
    document.getElementById("votes");


  const select =
    document.getElementById("constituency");


  const selected =
    select.value;


  if (!selected) {

    container.innerHTML =
      '<div class="notice">' +
      'Select your constituency above ' +
      'to see how your TDs voted.' +
      '</div>';

    return;

  }


  /* GET TDs FOR SELECTED CONSTITUENCY */

  const selectedMembers =
    allMembers.filter(result => {

      const member =
        result.member || {};


      return getMemberConstituencies(
        member
      ).includes(selected);

    });


  if (!selectedMembers.length) {

    container.innerHTML =
      "<p>No TDs found.</p>";

    return;

  }


  /* SHOW RECENT VOTES */

  const recentVotes =
    allVotes.slice(0, 20);


  container.innerHTML =
    recentVotes.map(result => {

      const division =
        result.division ||
        result;


      const date =
        division.date ||
        "";


      const subject =
        division.subject ||
        division.voteNote ||
        "Dáil division";


      const officialUrl =
        division.uri ||
        division.url ||
        "";


      const tdResults =
        selectedMembers.map(memberResult => {

          const member =
            memberResult.member ||
            {};


          const name =
            member.fullName ||
            (
              (member.firstName || "") +
              " " +
              (member.lastName || "")
            ).trim();


          const vote =
            getTDVote(
              division,
              member
            );


          return `
            <div class="td-vote">

              <div class="td-vote-name">
                ${escapeHtml(
                  name || "Unknown TD"
                )}
              </div>

              <div class="vote-result">
                ${escapeHtml(vote)}
              </div>

            </div>
          `;

        }).join("");


      return `
        <div class="vote">

          <div class="vote-date">
            ${escapeHtml(
              formatDate(date)
            )}
          </div>

          <div class="vote-title">
            ${escapeHtml(subject)}
          </div>

          ${tdResults}

          ${
            officialUrl
              ? `
                <a
                  class="official"
                  href="${escapeHtml(officialUrl)}"
                  target="_blank">
                  View official Oireachtas record
                </a>
              `
              : ""
          }

        </div>
      `;

    }).join("");

}


/* ==============================
   FORMAT DATE
============================== */

function formatDate(date) {

  if (!date) {
    return "";
  }


  try {

    const d =
      new Date(date);


    return d.toLocaleDateString(
      "en-IE",
      {
        day: "numeric",
        month: "long",
        year: "numeric"
      }
    );

  } catch {

    return date;

  }

}


/* ==============================
   HTML SAFETY
============================== */

function escapeHtml(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* ==============================
   START
============================== */

loadTDs();

loadVotes();

</script>

</body>
</html>
